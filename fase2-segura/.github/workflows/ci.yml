name: SecDevOps CI

# Pipeline minimo de "shift-left security": lint, tests y analisis de
# dependencias en cada push/PR. En fase1 no existia ningun pipeline.
on:
  push:
    paths: ["fase2-segura/**"]
  pull_request:
    paths: ["fase2-segura/**"]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fase2-segura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install
      - name: Lint (SAST basico de estilo/errores)
        run: npx eslint src || true
      - name: Tests unitarios
        run: npm test
      - name: Auditoria de dependencias (SCA)
        run: npm audit --audit-level=high || true
